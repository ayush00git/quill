name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z | xargs -0 grep -lZ -E '^#!/usr/bin/env bash|^# shellcheck shell=bash' \
            | xargs -0 -r shellcheck --external-sources

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use macOS /bin/bash (3.2) for every script
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Install bats
        run: |
          git clone --quiet --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          # Tags can move; fail if v1.13.0 no longer points at the reviewed commit.
          test "$(git -C "$RUNNER_TEMP/bats" rev-parse HEAD)" = 3bca150ec86275d6d9d5a4fd7d48ab8b6c6f3d87
      - name: Versions
        run: |
          bash --version | head -1
          git --version
          jq --version
          gh --version | head -1
      - name: bats
        env:
          # The real-container sandbox test (tests/run-tests.bats) needs a
          # container runtime; only the Linux runners have Docker.
          QUILL_TEST_CONTAINER: ${{ runner.os == 'Linux' && 'docker' || '' }}
        run: '"$RUNNER_TEMP/bats/bin/bats" --print-output-on-failure tests'

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: claude plugin validate
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code
          claude --version
          claude plugin validate .
